services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hinkle
      POSTGRES_USER: hinkle
      POSTGRES_PASSWORD: ${HINKLE_DB_PASSWORD:?Set HINKLE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hinkle-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hinkle -d hinkle"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hinkle-data:
